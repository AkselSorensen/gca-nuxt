name: Deploy OVH

on:
  push:
    branches: [main]

# Un seul déploiement à la fois : un nouveau push annule celui en cours
# (sinon plusieurs builds Docker se disputent le CPU du VPS et tout ralentit).
concurrency:
  group: deploy-ovh
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy sur le VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OVH_HOST }}
          username: gsa
          key: ${{ secrets.OVH_SSH_KEY }}
          command_timeout: 40m
          script: |
            cd /opt/gsa
            git pull origin main
            docker compose up -d --build --force-recreate
            docker image prune -f
