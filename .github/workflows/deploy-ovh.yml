name: Deploy OVH

on:
  push:
    branches: [main]

# Un seul déploiement à la fois : un nouveau push annule celui en cours.
concurrency:
  group: deploy-ovh
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/akselsorensen/gca-nuxt

jobs:
  build:
    name: Construire l'image (sur GitHub, pas sur le VPS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déployer sur le VPS (simple téléchargement de l'image)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.OVH_HOST }}
          username: gsa
          key: ${{ secrets.OVH_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          command_timeout: 15m
          script: |
            set -e
            cd /opt/gsa
            git pull origin main
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull app
            docker compose up -d --force-recreate app
            docker logout ghcr.io
            docker image prune -f
