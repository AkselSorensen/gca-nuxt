services:
  app:
    # Image construite par GitHub Actions (voir .github/workflows/deploy-ovh.yml)
    image: ghcr.io/akselsorensen/gca-nuxt:latest
    build: .
    restart: always
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/", "||", "exit", "1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
